    <!-- Javascript: makes the mobile hamburger menu open and close. 
     JS adds or removes a CSS class. 
     The CSS declares what the menu looks like when thaat class is present. -->

    <script>
      // Wait until the html document has finished loading.
      // HTML this ensures the buttons exist before JS tries to select them.
      document.addEventListener("DOMContentLoaded", () => {
        // Find the hamburger button inside the mobile menu container
        const hamburgerButton = document.querySelector(
          ".hamburger-menu button",
        );

        // Find the X button used to close the navigation menu
        const closeButton = document.querySelector(".close-menu");

        // Find container holding the navigation links
        const menu1 = document.querySelector(".menu1");

        // When the hamburger button is clicked,
        // add the class "menu-deployed" to the navigation menu.
        // Then CSS uses this class to make the menu visible.
        hamburgerButton.addEventListener("click", () => {
          menu1.classList.add("menu-deployed");
        });

        // When the X button is clicked, remove "menu-deployed" so that the menu closes.
        closeButton.addEventListener("click", () => {
          menu1.classList.remove("menu-deployed");
        });
      });
    </script>
