<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final Website</title>

    <meta
      name="description"
      content="Alternative applications that respect users' privacy."
    />

    <!-- Open Graph metadata - controls how the page looks when shared on social media -->
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Alternative applications that respect users' privacy." />
    <meta
      property="og:description"
      content="Alternative applications that respect users' privacy."
    />

    <!-- The page URL and image use din social media previews -->
    <meta property="og:url" content="put your url here" />
    <meta
      property="og:image"
      content="https://iliannaf.github.io/cart211/final/index.html"
    />

    <!-- The Dimensions and alternative description of the preview image.
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Portrait associated with the America Pageant story"
    /> -->

    <!-- Twitter card metadata controls the appearance of shared links on X -->
    <meta name="twitter:card" content="Title" />
    <meta name="twitter:title" content="Title" />
    <meta name="twitter:description" content="Title" />
    <meta
      name="twitter:image"
      content="https://hybrid.concordia.ca/btodd/assignment5-6/assets/america_pageant.jpg"
    />

    <!-- Identifies the preferred URL for this page to search engines -->
    <link
      rel="canonical"
      href="https://iliannaf.github.io/cart211/final/index.html"
    />

    <!-- Adds a small icon to the browser tab
    <link rel="icon" href="assets/favicon.ico" /> -->

    <meta name="author" content="Ilianna Faoro" />
    <meta name="copyright" content="Ilianna Faoro, student project, Fall 2026" />

    <link rel="stylesheet" href="main-style.css" />

    <!-- Loads Google Fonts for use in the CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Loads Font Awesome, a library of ready-made icons -->
    <!-- The Social media icons and hamburger menu use this library -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
