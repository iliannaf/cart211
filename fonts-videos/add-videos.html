<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adding Videos to the Web</title>
    <style>
      /* Styles the entire website */
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 20px;
      }

      /* styles the video player */
      video {
        /* Places the video on its own line */
        display: block;
        width: 100%;

        /* sets a standard widescreen video ratio */
        aspect-ratio: 16 / 9;

        height: auto;

        /* displays a black background while video loads */
        background-color: black;
      }
    </style>
  </head>
  <body>
    <h1>Video in Website</h1>
    <p>Watch the video below</p>

    <!-- Creates a video player with built-in playback control -->
    <video controls>
      <source src="video.mp4" type="video/mp4" />
      Sorry, your browser cannot play this video. :[
    </video>
  </body>
</html>
